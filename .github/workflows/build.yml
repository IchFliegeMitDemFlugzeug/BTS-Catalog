name: Build BTS Excel

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VBA packaging tool
        run: python -m pip install --disable-pip-version-check pyOpenVBA

      - name: Generate and validate BTS.xlsm
        run: python scripts/build.py

      - name: Check VBA syntax and initialization where supported
        run: python scripts/check_vba.py

      - name: Commit verified workbook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTS.xlsm
          if ! git diff --cached --quiet; then
            git commit -m "build: update BTS.xlsm [skip ci]"
            git push
          fi
